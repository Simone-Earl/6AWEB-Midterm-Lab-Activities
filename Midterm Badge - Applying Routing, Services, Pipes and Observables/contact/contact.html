<h2>Contact Us</h2>

<div class="contact-container">
  
  <form (ngSubmit)="onSubmit()" #contactForm="ngForm" class="contact-form">
    
    <div class="form-group">
      <label for="name">Name:</label>
      <input type="text" id="name" name="name" [(ngModel)]="model.name" required placeholder="Enter your full name">
    </div>

    <div class="form-group">
      <label for="email">Email:</label>
      <input type="email" id="email" name="email" [(ngModel)]="model.email" required placeholder="Enter your email">
    </div>

    <div class="form-group">
      <label for="message">Message:</label>
      <textarea id="message" name="message" [(ngModel)]="model.message" placeholder="How can we help you?"></textarea>
    </div>

    <button type="submit" [disabled]="!contactForm.valid">Submit Request</button>
  </form>

  <div class="preview-box">
    <h3>Form Preview</h3>
    
    <p><strong>Name:</strong> {{ model.name | uppercase }}</p>
    <p><strong>Email:</strong> {{ model.email || '...' }}</p>
    <p><strong>Message:</strong></p>
    <p style="font-style: italic; color: #7f8c8d;">{{ model.message || 'No message entered yet...' }}</p>
    
    <div *ngIf="submitted" class="success-message">
      Stats: Submitted Successfully
    </div>
  </div>

</div>
